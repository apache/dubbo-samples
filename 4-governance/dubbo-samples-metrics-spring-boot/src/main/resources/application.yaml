management:
  metrics:
    tags:
      application: dubbo-samples-metrics-spring-boot
  prometheus:
    metrics:
      export:
        enabled: true
  server:
    port: 18081
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - health
          - info
          - env
          - prometheus
  endpoint:
    health:
      enabled: true
      show-details: always
    info:
      enabled: true
    env:
      enabled: true
    prometheus:
      enabled: true

spring:
  main:
    allow-circular-references: true
  info:
    app:
      name: dubbo-samples-metrics-spring-boot
      description: Dubbo metrics sample on Spring Boot 3

server:
  port: 18080

dubbo:
  application:
    name: metrics-provider
  registry:
    address: zookeeper://${ZOOKEEPER_ADDRESS:127.0.0.1}:2181
  metrics:
    protocol: prometheus
    enable: true
    # enable-jvm-metrics: true
